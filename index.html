:root {
  --green: #11C386;
  --green-d: #0EA372;
  --black: #000000;
  --graphite: #1A1A1A;
  --ink: #1A1A1A;
  --muted: #6B7178;
  --line: #E7E9EC;
  --bg: #F4F4F4;
  --card: #FFFFFF;
  --red: #D64545;
  --amber: #F0A500;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16,20,24,.06), 0 1px 3px rgba(16,20,24,.05);
  font-family: 'TT Norms Pro Serif', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: inherit;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 16px; }

/* ---------- App shell ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 20px;
  padding: 0 24px; height: 60px;
  background: var(--black); color: #fff;
  position: sticky; top: 0; z-index: 30;
}
.brand { --logo-h: 22px; display: flex; align-items: center; gap: 11px; color: #fff; }
.brand .logo-mark { display: flex; align-items: center; color: #fff; }
.brand .logo-svg { height: var(--logo-h); width: auto; display: block; }
.brand .crm { font-family: 'TT Norms Pro Serif', 'Inter', sans-serif; color: var(--green); font-weight: 800; font-size: var(--logo-h); line-height: 1; letter-spacing: .5px; padding-left: 11px; border-left: 1px solid rgba(255,255,255,.22); }

.tabs { display: flex; gap: 4px; margin-left: 8px; }
.tab {
  background: transparent; border: 0; color: #B8BCC2;
  padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 15px;
}
.tab:hover { color: #fff; background: rgba(255,255,255,.06); }
.tab.active { color: #fff; background: rgba(17,195,134,.18); }

.spacer { flex: 1; }
.conn { font-size: 14px; color: #8A8F98; display: flex; align-items: center; gap: 8px; cursor: default; }
.conn-text { display: flex; flex-direction: column; line-height: 1.15; }
.conn-sub { font-size: 11px; color: #7d8288; }
.conn-sub.warn { color: var(--amber); }
.conn-on .conn-text { color: #E8E9EA; font-weight: 600; }
.conn-err .conn-text { color: #ff9a9a; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #8A8F98; flex: 0 0 8px; }
.dot.on { background: var(--green); }
.dot.err { background: var(--red); }
.dot.pulse { animation: cpulse 2s ease-out infinite; }
@keyframes cpulse {
  0%   { box-shadow: 0 0 0 0 rgba(17,195,134,.55); }
  70%  { box-shadow: 0 0 0 7px rgba(17,195,134,0); }
  100% { box-shadow: 0 0 0 0 rgba(17,195,134,0); }
}

.btn {
  border: 0; border-radius: 8px; padding: 9px 16px;
  font-weight: 700; font-size: 15px;
}
.btn-primary { background: var(--green); color: #062b1f; }
.btn-primary:hover { background: var(--green-d); color:#fff; }
.btn-ghost { background: rgba(255,255,255,.08); color: #fff; }
.btn-ghost:hover { background: rgba(255,255,255,.16); }
.btn-line { background:#fff; border:1px solid var(--line); color: var(--ink); }
.btn-line:hover { border-color: #cfd3d8; }
.btn-danger { background: #fff; border:1px solid #f0c4c4; color: var(--red); }
.btn-sm { padding: 6px 12px; font-size: 14px; }

.main { flex: 1; padding: 20px 24px 60px; }

/* ---------- Kanban ---------- */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col {
  flex: 0 0 268px; background: #EEF0F2; border-radius: 12px;
  display: flex; flex-direction: column; max-height: calc(100vh - 150px);
}
.col-head {
  padding: 12px 12px 8px; display: flex; align-items: center; gap: 8px;
  position: sticky; top: 0;
}
.col-tag { width: 10px; height: 10px; border-radius: 3px; }
.col-title { font-weight: 700; font-size: 15px; }
.col-count { color: var(--muted); font-weight: 600; font-size: 14px; }
.col-sum { margin-left: auto; color: var(--muted); font-size: 14px; font-weight: 600; }
.col-body { padding: 0 8px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.col.drop { outline: 2px dashed var(--green); outline-offset: -3px; }

.deal {
  background: var(--card); border-radius: 10px; padding: 11px 12px;
  box-shadow: var(--shadow); border: 1px solid transparent; cursor: grab;
}
.deal:hover { border-color: #d8dbe0; }
.deal:active { cursor: grabbing; }
.deal .dname { font-weight: 700; font-size: 15px; line-height: 1.25; }
.deal .dprod { color: var(--muted); font-size: 14px; margin-top: 3px; }
.deal .drow { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.deal .damt { font-weight: 800; font-size: 15px; }
.deal .down { font-size: 13px; color: var(--muted); background: var(--bg); padding: 2px 7px; border-radius: 20px; }
.deal .dnext { margin-top: 7px; font-size: 13px; color: var(--muted); display:flex; align-items:center; gap:5px; }
.deal .dnext.over { color: var(--red); font-weight: 600; }
.tag-recur { font-size: 12px; color: var(--green-d); border:1px solid #bfe9d8; padding:1px 5px; border-radius: 20px; margin-left: 6px; }

/* ---------- Contractors table ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1; min-width: 220px; }
.input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: #fff; outline: none;
}
.input:focus { border-color: var(--green); }
select.input { min-width: 150px; cursor: pointer; }

.panel { background: #fff; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.panel > table { min-width: 860px; }
.panel { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 11px 14px; font-size: 15px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: .4px; background: #FAFBFB; position: sticky; top: 0; }
tbody tr:hover { background: #FAFCFB; }
td .co { font-weight: 700; }
td .sub { color: var(--muted); font-size: 14px; }

.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 13px; font-weight: 700; }
.badge.ready { background: #E4F7EF; color: var(--green-d); }
.badge.draft { background: #FFF2E0; color: #B47100; }
.badge.top { background: #FFF6D6; color: #9A6B00; margin-left: 6px; }
.badge.indeal { background: #EDEBFF; color: #6A4CF0; }

.lvl { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; color: #fff; font-weight: 800; font-size: 14px; }
.lvl-nd { background: #E7E9EC; color: #8A8F98; }
.rate { display: flex; align-items: center; gap: 8px; }
.score { color: var(--muted); font-weight: 700; font-size: 13px; }
.crow { cursor: pointer; }
.top-toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); font-weight: 500; white-space: nowrap; cursor: pointer; }
.more { display: flex; align-items: center; gap: 14px; padding: 14px; border-top: 1px solid var(--line); }
.more-info { color: var(--muted); font-size: 13px; }

/* карточка подрядчика */
.info { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; }
.info-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.info-k { color: var(--muted); flex: 0 0 auto; }
.info-v { font-weight: 600; text-align: right; word-break: break-word; min-width: 0; }
.info-desc { margin-top: 12px; font-size: 14px; color: var(--ink); background: var(--bg); padding: 12px; border-radius: 10px; }
.files { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.file-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.file-name { font-weight: 600; font-size: 14px; color: #0EA372; text-decoration: none; flex: 1 1 100%; word-break: break-word; min-width: 0; }
.file-meta { color: var(--muted); font-size: 12px; margin-right: auto; }
.file-x { border: 0; background: var(--bg); color: var(--muted); width: 26px; height: 26px; border-radius: 6px; flex: 0 0 26px; }
.file-x:hover { background: #ffe2e2; color: var(--red); }
.hint-sm { color: var(--muted); font-size: 12px; margin-top: 6px; }
.link-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }

/* ---------- Analytics ---------- */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.kpi .k-label { color: var(--muted); font-size: 14px; font-weight: 600; }
.kpi .k-val { font-size: 30px; font-weight: 800; margin-top: 6px; letter-spacing: -.5px; }
.kpi .k-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.funnel { background:#fff; border-radius:12px; padding:18px; box-shadow: var(--shadow); }
.f-row { display: grid; grid-template-columns: 150px 1fr 90px 70px; align-items: center; gap: 12px; padding: 7px 0; }
.f-bar { height: 22px; border-radius: 6px; min-width: 3px; }
.f-name { font-weight: 600; font-size: 15px; }
.f-num { text-align: right; font-weight: 700; font-size: 15px; }
.f-sum { text-align: right; color: var(--muted); font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.h3 { font-weight: 700; font-size: 16px; margin: 0 0 12px; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10,14,18,.42); z-index: 60; display: flex; justify-content: flex-end; }
.drawer { width: 480px; max-width: 96vw; background: #fff; height: 100%; overflow-y: auto; box-shadow: -8px 0 30px rgba(0,0,0,.12); animation: slidein .18s ease; }
@keyframes slidein { from { transform: translateX(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.dr-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display:flex; align-items:flex-start; gap:10px; }
.dr-title { font-size: 20px; font-weight: 800; line-height: 1.2; word-break: break-word; }
.dr-sub { color: var(--muted); font-size: 14px; margin-top: 3px; word-break: break-word; }
.x { margin-left:auto; border:0; background:var(--bg); width:30px; height:30px; border-radius:8px; font-size: 18px; color:var(--muted); }
.dr-body { padding: 18px 20px; }
.field { margin-bottom: 14px; }
.field label { display:block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.stage-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border:1px solid var(--line); background:#fff; border-radius:20px; padding:5px 11px; font-size: 14px; font-weight:600; color:var(--muted); }
.chip.on { color:#fff; border-color:transparent; }
.dr-actions { display:flex; gap:8px; margin: 6px 0 20px; }

.timeline { margin-top: 8px; }
.act { display:flex; gap:10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.act .a-dot { width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:5px;flex:0 0 8px; }
.act .a-text { font-size: 15px; }
.act .a-meta { font-size: 13px; color:var(--muted); margin-top:2px; }
.addnote { display:flex; gap:8px; margin-top:10px; }

.empty { text-align:center; color:var(--muted); padding: 60px 20px; }
.empty .big { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }

@media (max-width: 1024px) and (min-width: 641px) {
  .main { padding: 16px 16px 48px; }
  .topbar { padding: 0 14px; gap: 12px; }
  .topbar .conn .conn-sub { display: none; }
  .toolbar .search { min-width: 180px; }
  .toolbar select.input { min-width: 120px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .drawer { width: 440px; }
  th, td { padding: 10px 11px; }
}

@media (max-width: 900px) {
  .grid { grid-template-columns: repeat(2,1fr); }
  .two { grid-template-columns: 1fr; }
  .tabs .tab { padding: 8px 10px; }
}

/* ---------- Login ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--black); padding: 20px; }
.login-card { width: 360px; max-width: 92vw; background: var(--graphite); border: 1px solid #2a2a2a; border-radius: 16px; padding: 28px 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.login-card .brand { --logo-h: 30px; justify-content: center; margin-bottom: 4px; }
.login-sub { text-align: center; color: #9AA0A6; font-size: 15px; margin-bottom: 20px; }
.login-users { display: flex; flex-direction: column; gap: 8px; }
.login-user { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; border: 1px solid #333; background: #1f1f1f; color: #E8E9EA; font-weight: 600; font-size: 16px; text-align: left; }
.login-user:hover { border-color: #444; background: #242424; }
.login-user.on { border-color: var(--green); background: rgba(17,195,134,.12); color: #fff; }
.lu-ava { width: 26px; height: 26px; border-radius: 50%; background: var(--green); color: #062b1f; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
.login-pw { display: flex; gap: 8px; margin-top: 14px; }
.login-pw .input { background: #1f1f1f; border-color: #333; color: #fff; }
.login-pw .input:focus { border-color: var(--green); }
.login-err { color: #ff8686; font-size: 14px; margin-top: 10px; text-align: center; }
.login-hint { color: #7d8288; font-size: 13px; margin-top: 16px; text-align: center; line-height: 1.5; border-top: 1px solid #2a2a2a; padding-top: 12px; }

.userchip { display: flex; align-items: center; gap: 8px; color: #E8E9EA; font-size: 15px; font-weight: 600; }
.userchip .uc-name { white-space: nowrap; }
.userchip .uc-ava { width: 24px; height: 24px; border-radius: 50%; background: var(--green); color: #062b1f; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
.logout { border: 0; background: rgba(255,255,255,.08); color: #B8BCC2; padding: 6px 11px; border-radius: 7px; font-size: 14px; font-weight: 600; }
.logout:hover { background: rgba(255,255,255,.16); color: #fff; }

.admin-badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 700; background: rgba(17,195,134,.18); color: var(--green); vertical-align: middle; }
.login-user .admin-badge { margin-left: auto; }
.you-badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--bg); color: var(--muted); }
.btn-users { background: rgba(255,255,255,.08); color: #fff; border: 0; }
.btn-users:hover { background: rgba(255,255,255,.16); }

.user-list { display: flex; flex-direction: column; gap: 8px; }
.user-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.user-row .uc-ava { width: 28px; height: 28px; flex: 0 0 28px; }
.user-row > div:first-of-type { min-width: 110px; }

/* ======================= Мобильная версия ======================= */
@media (max-width: 640px) {
  .main { padding: 14px 12px 48px; }

  /* Шапка в две строки: бренд + действия, вкладки — прокручиваемой лентой ниже */
  .topbar { flex-wrap: wrap; height: auto; min-height: 0; padding: 8px 12px; gap: 10px 8px; position: sticky; }
  .topbar .spacer { display: none; }
  .topbar .conn { order: 5; gap: 5px; }
  .topbar .conn .conn-sub { display: none; }
  .topbar .conn .conn-text { font-size: 12px; }
  .brand { margin-right: auto; --logo-h: 19px; }
  .tabs { order: 10; width: 100%; margin: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { white-space: nowrap; flex: 0 0 auto; }
  .topbar .btn-primary { padding: 8px 12px; }
  .userchip .uc-name { display: none; }
  .logout { padding: 6px 9px; }

  /* Воронка: одна колонка на экран с «подглядыванием» соседней, свайп по горизонтали */
  .col { flex-basis: 84vw; max-width: 340px; max-height: none; }
  .board { gap: 10px; }

  /* Таблица подрядчиков → карточки */
  .toolbar { gap: 8px; }
  .toolbar .search { flex-basis: 100%; }
  .toolbar select.input { flex: 1 1 45%; min-width: 0; }
  .toolbar .btn-primary { margin-left: 0 !important; flex: 1 1 100%; }
  .panel { overflow-x: visible; }
  .panel > table { min-width: 0; }
  .panel thead { display: none; }
  .panel table, .panel tbody, .panel tr, .panel td { display: block; width: 100%; }
  .panel tr { border-bottom: 1px solid var(--line); padding: 10px 4px; }
  .panel tbody tr:hover { background: transparent; }
  .panel td { border: 0; padding: 4px 14px; display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .panel td::before { content: attr(data-label); color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; flex: 0 0 82px; }
  .panel td[data-label=""]::before { content: none; }
  .panel td[data-label=""] { justify-content: flex-end; padding-top: 8px; }
  .panel td .sub { text-align: right; }
  .panel td[data-label="Рейтинг"] .rate { flex: 1; justify-content: flex-end; }
  .panel td[data-label="Контакты"], .panel td[data-label="Руководитель"] { text-align: right; word-break: break-word; }
  .more { flex-direction: column; align-items: stretch; gap: 8px; }
  .more-info { text-align: center; }

  /* Аналитика */
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi { padding: 13px 14px; }
  .kpi .k-val { font-size: 24px; }
  .f-row { grid-template-columns: 92px 1fr 40px 66px; gap: 8px; }
  .f-name { font-size: 14px; }

  /* Карточка сделки и модалки — на весь экран */
  .drawer { width: 100vw; max-width: 100vw; }
  .login-card { padding: 24px 20px; }
  .info { grid-template-columns: 1fr; }
  .toolbar .top-toggle { flex-basis: 100%; }
  .dr-title { font-size: 18px; }
  .user-row { gap: 6px; }
  .user-row .btn-sm { padding: 6px 9px; font-size: 12px; }
  .file-meta { font-size: 11px; }
}
</style>
